name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Build All Targets
        run: |
          mkdir -p dist
          
          # Target Matrix
          PLATFORMS=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%/*}"
            GOARCH="${PLATFORM#*/}"
            BIN_NAME="memos2txt"
            EXT=""
            
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi
            
            OUTPUT_NAME="memos2txt-${GOOS}-${GOARCH}${EXT}"
            echo "==> Building ${OUTPUT_NAME}..."
            
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "dist/${OUTPUT_NAME}" \
              ./cmd/memos2txt
          done

      - name: Generate Checksums & Archives
        working-directory: dist
        run: |
          # Create compressed archives
          for file in memos2txt-*; do
            if [[ "$file" == *.exe ]]; then
              zip "${file%.exe}.zip" "$file"
            else
              tar -czvf "${file}.tar.gz" "$file"
            fi
          done
          
          # Generate SHA256 checksums for all distribution files
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memos2txt-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true
